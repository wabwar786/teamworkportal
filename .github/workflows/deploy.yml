name: CI + Deploy to Railway

# Every push to main: install, sanity-check, then deploy to Railway.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl, tokenizer, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate --force

      - name: Sanity check (routes + config load)
        run: |
          php artisan route:list > /dev/null
          php -l public/index.php

      # Railway auto-deploys from GitHub once connected. This step is only
      # needed if you prefer CLI deploys. Add RAILWAY_TOKEN as a repo secret.
      - name: Deploy to Railway
        if: ${{ secrets.RAILWAY_TOKEN != '' }}
        run: |
          npm i -g @railway/cli
          railway up --service "${{ secrets.RAILWAY_SERVICE }}" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
